<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Selected Crime Types in Stone Mill Run, 2020–2025</title>
<style>
  body { margin:0; font-family: Georgia, "Times New Roman", serif; background:#fff; color:#1d2421; }
  .wrap { max-width:960px; margin:0 auto; padding:12px 16px; }
  h1 { font-size:22px; text-align:center; margin:8px 0 4px; }
  .sub { text-align:center; font-family: Arial, Helvetica, sans-serif; font-size:13px; color:#5b6661; margin:0 0 6px; }
  svg { width:100%; height:auto; display:block; }
  .grid { stroke:#e3e8e4; stroke-width:1; }
  .axis { stroke:#9aa59f; stroke-width:1; }
  .ytick, .xtick { font-family: Arial, Helvetica, sans-serif; font-size:14px; fill:#5b6661; }
  .ylabel, .xlabel { font-family: Arial, Helvetica, sans-serif; font-size:15px; font-weight:bold; fill:#1d2421; }
  .val { font-family: Arial, Helvetica, sans-serif; font-size:15px; font-weight:bold; fill:#1d2421; }
  .area { fill:#e1f2dc; }
  .line { fill:none; stroke:#1f5130; stroke-width:3; stroke-linejoin:round; stroke-linecap:round; }
  .dot { fill:#1f5130; stroke:#fff; stroke-width:2; }
  .src { font-family: Arial, Helvetica, sans-serif; font-size:12px; color:#5b6661; }
</style></head>
<body><div class="wrap">
<h1>Selected Crime Types in Stone Mill Run</h1>
<svg viewBox="0 0 960 560" role="img" aria-label="Area line chart of crime counts in Stone Mill Run rising from 183 in 2020 to a peak of 240 in 2023, then 214 in 2025. Y-axis runs from 150 to 300.">
  <line x1="90" x2="920" y1="470.0" y2="470.0" class="grid"/><text x="78" y="475.0" class="ytick" text-anchor="end">150</text><line x1="90" x2="920" y1="326.7" y2="326.7" class="grid"/><text x="78" y="331.7" class="ytick" text-anchor="end">200</text><line x1="90" x2="920" y1="183.3" y2="183.3" class="grid"/><text x="78" y="188.3" class="ytick" text-anchor="end">250</text><line x1="90" x2="920" y1="40.0" y2="40.0" class="grid"/><text x="78" y="45.0" class="ytick" text-anchor="end">300</text>
  <line x1="90" x2="920" y1="470.0" y2="470.0" class="axis"/>
  <line x1="90" x2="90" y1="40" y2="470.0" class="axis"/>
  <polygon points="147.2,470.0 147.2,375.4 290.3,366.8 433.4,332.4 576.6,212.0 719.7,295.1 862.8,286.5 862.8,470.0" class="area"/>
  <polyline points="147.2,375.4 290.3,366.8 433.4,332.4 576.6,212.0 719.7,295.1 862.8,286.5" class="line"/>
  <circle cx="147.2" cy="375.4" r="6" class="dot"/><text x="147.2" y="361.4" class="val" text-anchor="middle">183</text><circle cx="290.3" cy="366.8" r="6" class="dot"/><text x="290.3" y="352.8" class="val" text-anchor="middle">186</text><circle cx="433.4" cy="332.4" r="6" class="dot"/><text x="433.4" y="318.4" class="val" text-anchor="middle">198</text><circle cx="576.6" cy="212.0" r="6" class="dot"/><text x="576.6" y="198.0" class="val" text-anchor="middle">240</text><circle cx="719.7" cy="295.1" r="6" class="dot"/><text x="719.7" y="281.1" class="val" text-anchor="middle">211</text><circle cx="862.8" cy="286.5" r="6" class="dot"/><text x="862.8" y="272.5" class="val" text-anchor="middle">214</text>
  <text x="147.2" y="496.0" class="xtick" text-anchor="middle">2020</text><text x="290.3" y="496.0" class="xtick" text-anchor="middle">2021</text><text x="433.4" y="496.0" class="xtick" text-anchor="middle">2022</text><text x="576.6" y="496.0" class="xtick" text-anchor="middle">2023</text><text x="719.7" y="496.0" class="xtick" text-anchor="middle">2024</text><text x="862.8" y="496.0" class="xtick" text-anchor="middle">2025</text>
  <text x="28" y="255.0" class="ylabel" text-anchor="middle" transform="rotate(-90 28 255.0)">Crime Counts</text>
  <text x="505.0" y="546" class="xlabel" text-anchor="middle">Year</text>
</svg>
<p class="src">Note: the vertical axis starts at 150, not 0, to show year-to-year change more clearly.</p>
</div></body></html>
